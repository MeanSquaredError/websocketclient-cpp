name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VCPKG_DISABLE_METRICS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            preset: gcc_debug_tests
            cxx: g++-13
          - name: GCC 14
            preset: gcc_debug_tests
            cxx: g++-14
          - name: Clang 16
            preset: clang_debug_tests
            cxx: clang++-16
          - name: Clang 18
            preset: clang_debug_tests
            cxx: clang++-18

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public headers
        run: |
          for header in ws_client.hpp ws_client_async.hpp; do
            printf '#include "ws_client/%s"\n' "$header" |
              ${{ matrix.cxx }} -std=c++23 -Iinclude \
                -Wall -Wextra -Wpedantic -Werror \
                -x c++ -fsyntax-only -
          done

      - name: Configure and build
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build/${{ matrix.preset }} --parallel 2

      - name: Run unit tests
        run: >-
          ctest --test-dir build/${{ matrix.preset }}/tests
          --output-on-failure --parallel 2
