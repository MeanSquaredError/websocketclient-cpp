name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_DISABLE_METRICS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            version: 13
            preset: gcc_debug_tests
            cc: gcc-13
            cxx: g++-13
            standard: c++23
            stdlib: ""
            triplet: x64-linux
            debug_flags: -g
            libcxx: false
            libcxx_version: 0
          - name: GCC 14
            version: 14
            preset: gcc_debug_tests
            cc: gcc-14
            cxx: g++-14
            standard: c++23
            stdlib: ""
            triplet: x64-linux
            debug_flags: -g
            libcxx: false
            libcxx_version: 0
          - name: Clang 16
            version: 16
            preset: clang_debug_tests
            cc: clang-16
            cxx: clang++-16
            standard: c++2b
            stdlib: -stdlib=libc++
            triplet: x64-linux-libcxx
            debug_flags: -g -stdlib=libc++
            libcxx: true
            libcxx_version: 18
          - name: Clang 18
            version: 18
            preset: clang_debug_tests
            cc: clang-18
            cxx: clang++-18
            standard: c++23
            stdlib: -stdlib=libc++
            triplet: x64-linux-libcxx
            debug_flags: -g -stdlib=libc++
            libcxx: true
            libcxx_version: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libc++
        if: matrix.libcxx
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            "libc++-${{ matrix.libcxx_version }}-dev" \
            "libc++abi-${{ matrix.libcxx_version }}-dev"

      - name: Check public headers
        run: |
          for header in ws_client.hpp ws_client_async.hpp; do
            printf '#include "ws_client/%s"\n' "$header" |
              "$CXX" -std=${{ matrix.standard }} ${{ matrix.stdlib }} -Iinclude \
                -Wall -Wextra -Wpedantic -Werror \
                -x c++ -fsyntax-only -
          done

      - name: Configure and build
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.debug_flags }}" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build/${{ matrix.preset }} --parallel 2

      - name: Run unit tests
        run: >-
          ctest --test-dir build/${{ matrix.preset }}/tests
          --output-on-failure --parallel 2
